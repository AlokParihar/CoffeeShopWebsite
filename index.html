<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernweh Coffee</title>
<style>
  body {
    margin: 0;
    background: #F5EBDD;
    color: #3B2A2A;
    font-family: Georgia, serif;
    line-height: 1.5;
  }
  .wrap { max-width: 500px; margin: 0 auto; padding: 40px 20px; }
  h1 { text-align: center; font-size: 2rem; margin-bottom: 0; }
  .tagline { text-align: center; color: #A65E2E; margin-top: 5px; }
  nav { text-align: center; margin: 20px 0 40px; }
  nav a {
    color: #3B2A2A; text-decoration: none; margin: 0 12px;
    border-bottom: 2px solid transparent; padding-bottom: 2px;
  }
  nav a.active { border-color: #A65E2E; }
  .page { display: none; }
  .page.active { display: block; }
  p.lede { text-align: center; max-width: 350px; margin: 0 auto 20px; }
  .center { text-align: center; }
  .btn {
    display: inline-block; background: #A65E2E; color: #fff;
    padding: 10px 20px; border-radius: 4px; text-decoration: none;
  }
  h2 { font-size: 1.2rem; border-bottom: 1px solid #A65E2E; padding-bottom: 5px; }
  .item { display: flex; justify-content: space-between; padding: 8px 0; }
  .item span:last-child { color: #A65E2E; }
  footer { text-align: center; color: #8a7f72; margin-top: 40px; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Fernweh</h1>
  <p class="tagline">coffee, quietly done</p>

  <nav>
    <a href="#" class="active" onclick="show('home')">Home</a>
    <a href="#" onclick="show('coffee')">Coffee</a>
  </nav>

  <div class="page active" id="home">
    <p class="lede">A small counter near 5th and Elm. Good beans, no rush.</p>
    <p class="center"><a class="btn" href="#" onclick="show('coffee')">See the coffee</a></p>
  </div>

  <div class="page" id="coffee">
    <h2>Espresso based</h2>
    <div class="item"><span>Espresso</span><span>$3.00</span></div>
    <div class="item"><span>Cortado</span><span>$4.25</span></div>
    <div class="item"><span>Cappuccino</span><span>$4.50</span></div>
    <div class="item"><span>Oat latte</span><span>$5.00</span></div>

    <h2>Brewed</h2>
    <div class="item"><span>Drip coffee</span><span>$3.50</span></div>
    <div class="item"><span>Pour over</span><span>$5.50</span></div>
    <div class="item"><span>Cold brew</span><span>$4.75</span></div>
  </div>

  <footer>214 Elm Street · 7am–4pm</footer>

</div>

<script>
  function show(page) {
    document.getElementById('home').classList.toggle('active', page === 'home');
    document.getElementById('coffee').classList.toggle('active', page === 'coffee');
  }
</script>
</body>
</html>
